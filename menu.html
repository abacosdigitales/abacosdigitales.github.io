.qr{text-align:center;margin-bottom:28px}
.qr h2{margin-left:0}
.qr a{display:block;width:220px;margin:0 auto;background:#fff;border-radius:16px;padding:12px}
.qr img{display:block;width:100%;height:auto}
.qr p{color:#f0f0f0;font-size:.85rem;margin-top:10px;text-shadow:0 1px 6px rgba(0,0,0,.85)}
.blog{margin-bottom:28px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px 4px}
.tab{font:inherit;font-size:.85rem;color:#f0f0f0;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 14px;cursor:pointer}
.tab[aria-pressed="true"]{color:#fff;background:var(--red);border-color:var(--red)}
.arts{display:grid;gap:10px}
.mas-arts{margin:12px auto 0;display:block}
details.art{background:rgba(14,14,16,.74);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:12px}
details.art summary{list-style:none;cursor:pointer;padding:14px 16px}
details.art summary::-webkit-details-marker{display:none}
details.art[open]{border-color:#444}
.meta{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.chip{font-weight:600;font-size:.75rem;padding:2px 10px;border-radius:999px;color:#fff;background:#444}
.chip.Tip{background:#1d4ed8}.chip.Noticia{background:#b91c1c}.chip.Novedad{background:#15803d}
.art h3{font-size:1.02rem;font-weight:600;line-height:1.3}
.art .res{color:var(--muted);font-size:.9rem;margin-top:4px}
.art .mas::after{content:"Leer más \2193"}
.art[open] .mas::after{content:"Cerrar \2191"}
.art .mas{display:inline-block;margin-top:8px;font-size:.85rem;font-weight:600}
.cuerpo{padding:0 16px 16px;color:#d6d6d6;font-size:.93rem}
.cuerpo p+p{margin-top:10px}
.cuerpo a{color:#fff;font-weight:600}
summary:focus-visible,.tab:focus-visible{outline:3px solid #fff;outline-offset:3px}
main{max-width:480px;margin:0 auto;padding:40px 20px 56px}
header{text-align:center;margin-bottom:24px}
.hero{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;margin-bottom:8px}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:35%;background:linear-gradient(to bottom,transparent,var(--bg))}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header p{color:var(--muted);font-size:1rem}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--wa);color:#06260f;font-weight:700;font-size:1.1rem;padding:18px;border-radius:14px;text-decoration:none;margin-bottom:32px}
.wa svg{width:26px;height:26px}
h2{font-size:.95rem;color:#fff;font-weight:700;margin:0 0 10px 4px;text-shadow:0 1px 8px rgba(0,0,0,.8)}
ul{list-style:none;padding:0;margin-bottom:28px;display:grid;gap:10px}
a.row{display:flex;align-items:center;gap:14px;background:rgba(14,14,16,.68);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-left:4px solid var(--red);border-radius:12px;padding:12px 16px;color:inherit;text-decoration:none}
a.row:hover{border-color:var(--red)}
.ico{flex:none;width:52px;height:52px;overflow:hidden;border-radius:10px;background:#222;display:grid;place-items:center;color:#fff}
.ico svg{width:26px;height:26px}
.ico.img{background:none}
a.row:hover .ico.img{background:none}
.wa img{width:36px;height:36px;background:#fff;border-radius:10px;padding:3px}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
a.row:hover .ico{background:var(--red)}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.txt{display:flex;flex-direction:column;min-width:0}
.txt b{font-weight:600}
.txt span{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
footer{text-align:center;color:#f0f0f0;font-size:.8rem;text-shadow:0 1px 6px rgba(0,0,0,.85)}
</style>
</head>

const NOMBRES_CAT = { Tip: "Tips", Noticia: "Noticias", Novedad: "Novedades" };

function tarjeta(a) {
  const d = document.createElement("details");
  d.className = "art";
  const sm = document.createElement("summary");
  const meta = document.createElement("div");
  meta.className = "meta";
  const chip = document.createElement("span");
  chip.className = "chip " + a.cat;
  chip.textContent = a.cat;
  const fecha = document.createElement("span");
  fecha.textContent = new Date(a.fecha + "T12:00:00").toLocaleDateString("es-AR", { day: "numeric", month: "short", year: "numeric" });
  meta.appendChild(chip); meta.appendChild(fecha);
  const h3 = document.createElement("h3"); h3.textContent = a.titulo;
  const res = document.createElement("p"); res.className = "res"; res.textContent = a.resumen;
  const mas = document.createElement("span"); mas.className = "mas";
  [meta, h3, res, mas].forEach(function (n) { sm.appendChild(n); });
  d.appendChild(sm);
  const cuerpo = document.createElement("div");
  cuerpo.className = "cuerpo";
  (a.cuerpo || []).forEach(function (t) {
    const p = document.createElement("p"); p.textContent = t; cuerpo.appendChild(p);
  });
  if (a.url) {
    const p = document.createElement("p");
    const l = document.createElement("a");
    l.href = a.url; l.target = "_blank"; l.rel = "noopener"; l.textContent = "Leer el artículo completo";
    p.appendChild(l); cuerpo.appendChild(p);
  }
  d.appendChild(cuerpo);
  return d;
}

function crearBlog() {
  const lista = ARTICULOS.slice().sort(function (a, b) { return b.fecha.localeCompare(a.fecha); });
  if (!lista.length) return null;
  const sec = document.createElement("section");
  sec.className = "blog";
  const h = document.createElement("h2"); h.textContent = "Novedades y consejos";
  const tabs = document.createElement("div"); tabs.className = "tabs";
  const cont = document.createElement("div"); cont.className = "arts";
  const mas = document.createElement("button");
  mas.type = "button"; mas.className = "tab mas-arts"; mas.textContent = "Ver más artículos";
  let cat = "Todo", todos = false;
  const cats = ["Todo"].concat(Array.from(new Set(lista.map(function (a) { return a.cat; }))));

  function pintar() {
    cont.innerHTML = "";
    const f = lista.filter(function (a) { return cat === "Todo" || a.cat === cat; });
    (todos ? f : f.slice(0, LIMITE_ARTICULOS)).forEach(function (a) { cont.appendChild(tarjeta(a)); });
    mas.style.display = (!todos && f.length > LIMITE_ARTICULOS) ? "" : "none";
    tabs.querySelectorAll("button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.cat === cat));
    });
  }
  if (cats.length > 2) {
    cats.forEach(function (c) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "tab"; b.dataset.cat = c;
      b.textContent = NOMBRES_CAT[c] || c;
      b.addEventListener("click", function () { cat = c; todos = false; pintar(); });
      tabs.appendChild(b);
    });
  }
  mas.addEventListener("click", function () { todos = true; pintar(); });
  sec.appendChild(h);
  if (tabs.children.length) sec.appendChild(tabs);
  sec.appendChild(cont); sec.appendChild(mas);
  pintar();
  return sec;
}

const menu = document.getElementById("menu");
let blogListo = false;
GRUPOS.forEach(function (g) {
  const items = g.items.filter(function (i) { return i.url.indexOf("TU_") === -1; });
  if (!items.length) return;
  const h = document.createElement("h2");
  h.textContent = g.titulo;
  const ul = document.createElement("ul");
  items.forEach(function (i) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "row";
    a.href = i.url;
    if (/^https?:/.test(i.url)) { a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML = '<span class="ico' + (i.img ? ' img' : '') + '">' + (i.img ? '<img src="' + i.img + '" alt="">' : svg(i.icono)) + '</span><span class="txt"><b></b><span></span></span>';
    a.querySelector("b").textContent = i.nombre;
    a.querySelector(".txt span").textContent = i.desc;
    li.appendChild(a);
    ul.appendChild(li);
  });
  menu.appendChild(h);
  menu.appendChild(ul);
  if (!blogListo) { blogListo = true; const b = crearBlog(); if (b) menu.appendChild(b); }
});

/* Sonido al tocar un enlace (se genera en el navegador, sin archivos) */
let audioCtx = null;
function sonido() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = audioCtx || new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    const filtro = audioCtx.createBiquadFilter();
    filtro.type = "lowpass";
    filtro.frequency.setValueAtTime(900, t);
    filtro.frequency.exponentialRampToValueAtTime(200, t + 0.4);
    filtro.connect(audioCtx.destination);
    /* capa grave: golpe que baja de tono */
    const grave = audioCtx.createOscillator();
    const gGrave = audioCtx.createGain();
    grave.type = "sine";
    grave.frequency.setValueAtTime(150, t);
    grave.frequency.exponentialRampToValueAtTime(55, t + 0.35);
    gGrave.gain.setValueAtTime(0.0001, t);
    gGrave.gain.exponentialRampToValueAtTime(0.55, t + 0.012);
    gGrave.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    grave.connect(gGrave); gGrave.connect(filtro);
    /* capa media: da cuerpo y se escucha en parlantes de celular */
    const cuerpo = audioCtx.createOscillator();
    const gCuerpo = audioCtx.createGain();
    cuerpo.type = "triangle";
    cuerpo.frequency.setValueAtTime(300, t);
    cuerpo.frequency.exponentialRampToValueAtTime(110, t + 0.3);
    gCuerpo.gain.setValueAtTime(0.0001, t);
    gCuerpo.gain.exponentialRampToValueAtTime(0.28, t + 0.01);
    gCuerpo.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    cuerpo.connect(gCuerpo); gCuerpo.connect(filtro);
    grave.start(t); grave.stop(t + 0.55);
    cuerpo.start(t); cuerpo.stop(t + 0.45);
  } catch (e) {}
}
document.addEventListener("click", function (e) {
  if (e.target.closest("a.row, a.wa")) sonido();
});
