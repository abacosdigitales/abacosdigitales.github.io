<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ábacosdigitales · Menú de contacto</title>
<meta name="description" content="Sitios, redes y WhatsApp de Ábacosdigitales, Rosario.">
<style>
:root{--bg:#0a0a0a;--card:#161616;--line:#2a2a2a;--text:#fff;--muted:#a8a8a8;--red:#e8261a;--wa:#25d366}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:40px 20px 56px}
header{text-align:center;margin-bottom:24px}
.hero{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;margin-bottom:8px}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:35%;background:linear-gradient(to bottom,transparent,var(--bg))}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header p{color:var(--muted);font-size:1rem}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--wa);color:#06260f;font-weight:700;font-size:1.1rem;padding:18px;border-radius:14px;text-decoration:none;margin-bottom:32px}
.wa svg{width:26px;height:26px}
h2{font-size:.95rem;color:var(--muted);font-weight:600;margin:0 0 10px 4px}
ul{list-style:none;padding:0;margin-bottom:28px;display:grid;gap:10px}
a.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:12px;padding:12px 16px;color:inherit;text-decoration:none}
a.row:hover{border-color:var(--red)}
.ico{flex:none;width:52px;height:52px;overflow:hidden;border-radius:10px;background:#222;display:grid;place-items:center;color:#fff}
.ico svg{width:26px;height:26px}
.ico.img{background:none}
a.row:hover .ico.img{background:none}
.wa img{width:36px;height:36px;background:#fff;border-radius:10px;padding:3px}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
a.row:hover .ico{background:var(--red)}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.txt{display:flex;flex-direction:column;min-width:0}
.txt b{font-weight:600}
.txt span{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
footer{text-align:center;color:var(--muted);font-size:.8rem}
</style>
</head>

GRUPOS.forEach(function (g) {
  const items = g.items.filter(function (i) { return i.url.indexOf("TU_") === -1; });

    const li = document.createElement("li");
    const a = document.createElement("a");

    a.querySelector(".txt span").textContent = i.desc;

    ul.appendChild(li);
  });
  menu.appendChild(h);
  menu.appendChild(ul);
});
