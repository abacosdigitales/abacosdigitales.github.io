<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Felices 16´s Loguito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1b1042;
    --panel: #2b1a66;
    --pink: #ff3d8b;
    --sun: #ffd23f;
    --mint: #2ee6c5;
    --cream: #fff4e0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%;
    background: radial-gradient(120% 80% at 50% 0%, #3a1f86 0%, var(--night) 60%);
    color: var(--cream);
    font-family: "Nunito", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 10px;
  }
  canvas {
    width: 100%; max-width: 480px; aspect-ratio: 2 / 3; max-height: calc(100vh - 110px); max-height: calc(100dvh - 110px);
    border-radius: 18px; background: var(--night);
    box-shadow: 0 0 0 3px var(--pink), 0 20px 60px rgba(0,0,0,.5);
    touch-action: none; cursor: none; display: block;
  }
  #mu { font: 800 15px "Nunito", system-ui, sans-serif; color: var(--cream); background: var(--panel); border: 2px solid var(--pink); border-radius: 999px; padding: 8px 18px; cursor: pointer; }
  #mu:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .hint { margin: 0; font-size: 14px; opacity: .8; text-align: center; max-width: 440px; }
  @media (prefers-reduced-motion: reduce) { canvas { box-shadow: 0 0 0 3px var(--pink); } }
</style>
</head>
<body>
<canvas id="c" width="960" height="1440" aria-label="Juego de globos"></canvas>
<button id="mu" type="button">🔊 Sonido</button>
<p class="hint">Deslizá el dedo para mover la paleta y tocá para lanzar. Reventá los globos para descubrir el mensaje.</p>
<script>
(function () {
  var W = 480, H = 720;
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  ctx.scale(2, 2);

  var COLS = 8, ROWS = 10, BW = 54, BH = 26, GAP = 4, TOP = 70;
  var OX = (W - (COLS * BW + (COLS - 1) * GAP)) / 2;
  var AREA_H = ROWS * (BH + GAP) - GAP;
  var COLORS = ['#ff3d8b', '#ff8a3d', '#ffd23f', '#2ee6c5', '#8b7bff'];
  var DISPLAY = '"Bagel Fat One", "Arial Black", Impact, sans-serif';
  var BODY = '"Nunito", system-ui, sans-serif';

  var LINES = [
    { t: 'Felices 16´s', s: 58, c: '#ffd23f' },
    { t: 'Loguito', s: 84, c: '#ff3d8b' },
    { t: 'te lo desea', s: 40, c: '#fff4e0' },
    { t: 'Aruchi', s: 60, c: '#2ee6c5' }
  ];

  var bricks, paddle, ball, particles, lives, state, shake, toast, toastT, confetti, winT = 0, keys = {};

  function buildBricks() {
    bricks = [];
    for (var r = 0; r < ROWS; r++)
      for (var c = 0; c < COLS; c++)
        bricks.push({ x: OX + c * (BW + GAP), y: TOP + r * (BH + GAP), color: COLORS[(r + c) % COLORS.length], alive: true });
  }
  function resetBall() {
    ball = { x: paddle.x, y: paddle.y - 14, vx: 0, vy: 0, r: 7, speed: 5.2, held: true };
  }
  function newGame() {
    paddle = { x: W / 2, y: H - 50, w: 90, h: 13 };
    particles = []; confetti = []; lives = 3; shake = 0; toast = ''; toastT = 0;
    buildBricks(); resetBall(); state = 'play';
  }
  function say(t) { toast = t; toastT = 150; }

  function launch() {
    startMusic();
    if (state === 'win') { if (winT > 180) newGame(); return; }
    if (ball.held) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
      ball.vx = Math.cos(a) * ball.speed; ball.vy = Math.sin(a) * ball.speed; ball.held = false;
    }
  }

  function pointerX(e) {
    var rc = cv.getBoundingClientRect();
    return (e.clientX - rc.left) / rc.width * W;
  }
  cv.addEventListener('pointermove', function (e) { paddle.x = clamp(pointerX(e), paddle.w / 2, W - paddle.w / 2); });
  cv.addEventListener('pointerdown', function (e) { paddle.x = clamp(pointerX(e), paddle.w / 2, W - paddle.w / 2); launch(); });
  window.addEventListener('keydown', function (e) {
    if (e.key === ' ') { e.preventDefault(); launch(); }
    keys[e.key] = true;
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function burst(x, y, color) {
    popSound();
    for (var i = 0; i < 22; i++) {
      var a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 4;
      particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 28 + Math.random() * 22, color: i % 4 === 0 ? '#fff4e0' : color, size: 2 + Math.random() * 3 });
    }
  }

  function popRandom() {
    setTimeout(function () {
      if (state !== 'play') return;
      var alive = bricks.filter(function (x) { return x.alive; });
      if (!alive.length) return;
      var r = alive[Math.floor(Math.random() * alive.length)];
      r.alive = false;
      burst(r.x + BW / 2, r.y + BH / 2, r.color);
      shake = 3;
      if (aliveCount() === 0) win();
    }, 140);
  }

  function aliveCount() { var n = 0; for (var i = 0; i < bricks.length; i++) if (bricks[i].alive) n++; return n; }

  function step() {
    if (keys.ArrowLeft || keys.a) paddle.x -= 8;
    if (keys.ArrowRight || keys.d) paddle.x += 8;
    paddle.x = clamp(paddle.x, paddle.w / 2, W - paddle.w / 2);

    if (state === 'win') return;
    if (ball.held) { ball.x = paddle.x; ball.y = paddle.y - 14; return; }

    var SUB = 3;
    for (var s = 0; s < SUB; s++) {
      ball.x += ball.vx / SUB; ball.y += ball.vy / SUB;

      if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

      // paleta
      if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 8 &&
          ball.x >= paddle.x - paddle.w / 2 - 4 && ball.x <= paddle.x + paddle.w / 2 + 4) {
        var rel = clamp((ball.x - paddle.x) / (paddle.w / 2), -1, 1);
        var ang = -Math.PI / 2 + rel * 1.0;
        ball.vx = Math.cos(ang) * ball.speed; ball.vy = Math.sin(ang) * ball.speed;
        ball.y = paddle.y - ball.r;
      }

      // ladrillos
      for (var i = 0; i < bricks.length; i++) {
        var b = bricks[i];
        if (!b.alive) continue;
        var dx = ball.x - (b.x + BW / 2), dy = ball.y - (b.y + BH / 2);
        var ox = BW / 2 + ball.r - Math.abs(dx), oy = BH / 2 + ball.r - Math.abs(dy);
        if (ox > 0 && oy > 0) {
          if (ox < oy) ball.vx = dx > 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
          else ball.vy = dy > 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
          b.alive = false;
          burst(b.x + BW / 2, b.y + BH / 2, b.color);
          popRandom();
          shake = 4;
          ball.speed = Math.min(7.4, ball.speed + 0.03);
          var m = Math.hypot(ball.vx, ball.vy);
          ball.vx = ball.vx / m * ball.speed; ball.vy = ball.vy / m * ball.speed;
          if (aliveCount() === 0) { win(); }
          break;
        }
      }
    }

    if (ball.y > H + 20) {
      lives--;
      if (lives <= 0) { lives = 3; say('¡Otra vez! Los globos reventados se quedan'); }
      resetBall();
    }
  }

  function win() {
    state = 'win'; winT = 0;
    for (var i = 0; i < 160; i++) {
      confetti.push({ x: Math.random() * W, y: -Math.random() * H, vy: 1.5 + Math.random() * 3, vx: (Math.random() - 0.5) * 2,
        c: COLORS[i % COLORS.length], s: 4 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3 });
    }
  }

  function fitLine(l, maxW) {
    var size = l.s;
    ctx.font = size + 'px ' + DISPLAY;
    var w = ctx.measureText(l.t).width;
    if (w > maxW) size = Math.floor(size * maxW / w);
    return size;
  }

  function drawMessage() {
    ctx.fillStyle = '#2b1a66';
    rr(OX - 6, TOP - 6, W - 2 * OX + 12, AREA_H + 12, 12); ctx.fill();
    var centers = [TOP + 38, TOP + 110, TOP + 180, TOP + 250];
    ctx.save();
    ctx.beginPath();
    for (var q = 0; q < bricks.length; q++) {
      var bb = bricks[q];
      if (!bb.alive) ctx.rect(bb.x - GAP / 2, bb.y - GAP / 2, BW + GAP, BH + GAP);
    }
    ctx.clip();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (var i = 0; i < LINES.length; i++) {
      var l = LINES[i], size = fitLine(l, W - 2 * OX - 24);
      ctx.font = size + 'px ' + DISPLAY;
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillText(l.t, W / 2 + 2, centers[i] + 3);
      ctx.fillStyle = l.c; ctx.fillText(l.t, W / 2, centers[i]);
    }
    ctx.restore();
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function draw() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#1b1042'; ctx.fillRect(0, 0, W, H);
    if (shake > 0) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.8; if (shake < 0.3) shake = 0; }

    // HUD
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.font = '800 16px ' + BODY; ctx.fillStyle = '#fff4e0';
    var left = aliveCount();
    ctx.fillText('Globos: ' + left, 14, 30);
    ctx.textAlign = 'right';
    var hearts = ''; for (var h = 0; h < lives; h++) hearts += '♥ ';
    ctx.fillStyle = '#ff3d8b'; ctx.font = '800 22px ' + BODY;
    ctx.fillText(hearts, W - 14, 30);

    drawMessage();

    // globos
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i]; if (!b.alive) continue;
      var cx = b.x + BW / 2, cy = b.y + BH / 2 - 1;
      ctx.strokeStyle = 'rgba(255,244,224,.55)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, cy + 17); ctx.quadraticCurveTo(cx - 4, cy + 22, cx + 1, cy + 27); ctx.stroke();
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.ellipse(cx, cy, 22, 17, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx, cy + 16); ctx.lineTo(cx - 3, cy + 21); ctx.lineTo(cx + 3, cy + 21); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.beginPath(); ctx.ellipse(cx - 8, cy - 6, 5, 3, -0.6, 0, Math.PI * 2); ctx.fill();
    }

    // partículas
    for (var p = particles.length - 1; p >= 0; p--) {
      var q = particles[p];
      q.x += q.vx; q.y += q.vy; q.vy += 0.12; q.life--;
      if (q.life <= 0) { particles.splice(p, 1); continue; }
      ctx.globalAlpha = Math.min(1, q.life / 20);
      ctx.fillStyle = q.color; ctx.fillRect(q.x, q.y, q.size, q.size);
    }
    ctx.globalAlpha = 1;

    // paleta
    ctx.fillStyle = '#2ee6c5'; rr(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; rr(paddle.x - paddle.w / 2 + 6, paddle.y + 2, paddle.w - 12, 3, 2); ctx.fill();

    // bola
    ctx.fillStyle = '#fff4e0'; ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    // mensajes de estado
    ctx.textAlign = 'center';
    if (state === 'play' && ball.held) {
      ctx.font = '800 16px ' + BODY; ctx.fillStyle = '#fff4e0';
      ctx.fillText('Tocá para lanzar', W / 2, H - 95);
    }
    if (toastT > 0) {
      toastT--;
      ctx.globalAlpha = Math.min(1, toastT / 30);
      ctx.font = '800 15px ' + BODY; ctx.fillStyle = '#ffd23f';
      ctx.fillText(toast, W / 2, H - 120);
      ctx.globalAlpha = 1;
    }

    // victoria
    if (state === 'win') {
      ctx.fillStyle = 'rgba(27,16,66,.78)'; ctx.fillRect(0, 0, W, H);
      for (var k = 0; k < confetti.length; k++) {
        var f = confetti[k];
        f.y += f.vy; f.x += f.vx; f.rot += f.vr;
        if (f.y > H + 10) { f.y = -10; f.x = Math.random() * W; }
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
        ctx.fillStyle = f.c; ctx.fillRect(-f.s / 2, -f.s / 4, f.s, f.s / 2); ctx.restore();
      }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      var ys = [H / 2 - 250, H / 2 - 175, H / 2 - 110, H / 2 - 45];
      for (var j = 0; j < LINES.length; j++) {
        var sz = fitLine(LINES[j], W - 50);
        ctx.font = sz + 'px ' + DISPLAY;
        ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillText(LINES[j].t, W / 2 + 2, ys[j] + 3);
        ctx.fillStyle = LINES[j].c; ctx.fillText(LINES[j].t, W / 2, ys[j]);
      }
      winT++;
      ctx.globalAlpha = Math.max(0, Math.min(1, (winT - 100) / 60));
      ctx.font = '40px ' + DISPLAY; ctx.fillStyle = '#ff3d8b'; ctx.fillText('♥', W / 2, 410);
      var TH = ['Agradezco al cielo', 'el tenerte en mi vida', 'mi hijito del corazón'];
      for (var m = 0; m < TH.length; m++) {
        var ts = fitLine({ t: TH[m], s: 34 }, W - 50);
        ctx.font = ts + 'px ' + DISPLAY;
        ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillText(TH[m], W / 2 + 2, 465 + m * 46 + 3);
        ctx.fillStyle = '#fff4e0'; ctx.fillText(TH[m], W / 2, 465 + m * 46);
      }
      ctx.font = '800 15px ' + BODY; ctx.fillStyle = '#fff4e0';
      if (winT > 180) ctx.fillText('Tocá para jugar de nuevo', W / 2, 640);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function loop() { step(); draw(); requestAnimationFrame(loop); }

  // ---- Música: Cumpleaños Feliz sintetizado, en bucle ----
  var actx = null, master = null, sfx = null, musicOn = true, nextLoop = 0, BEAT = 0.5;
  var TUNE = [[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],
              [392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
              [392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,1],
              [698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
  var muBtn = document.getElementById('mu');

  function note(freq, t, dur) {
    var o = actx.createOscillator(), o2 = actx.createOscillator();
    var g = actx.createGain(), g2 = actx.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    o2.type = 'sine'; o2.frequency.value = freq * 2; g2.gain.value = 0.25;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.6, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.3);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    o.start(t); o2.start(t); o.stop(t + dur + 0.4); o2.stop(t + dur + 0.4);
  }
  function scheduleLoop(t0) {
    var t = t0;
    for (var i = 0; i < TUNE.length; i++) { note(TUNE[i][0], t, TUNE[i][1] * BEAT); t += TUNE[i][1] * BEAT; }
    return t + BEAT * 1.5;
  }
  function popSound() {
    if (!actx || !sfx || actx.state !== 'running') return;
    var t = actx.currentTime;
    var len = Math.floor(actx.sampleRate * 0.18);
    var buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    var src = actx.createBufferSource(); src.buffer = buf;
    var hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 600 + Math.random() * 600;
    var g = actx.createGain();
    g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    src.connect(hp); hp.connect(g); g.connect(sfx); src.start(t);
    var o = actx.createOscillator(), og = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(220 + Math.random() * 80, t);
    o.frequency.exponentialRampToValueAtTime(50, t + 0.12);
    og.gain.setValueAtTime(0.8, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.connect(og); og.connect(sfx); o.start(t); o.stop(t + 0.2);
  }
  function tick() {
    if (!actx || actx.state !== 'running') return;
    if (nextLoop - actx.currentTime < 1.5) nextLoop = scheduleLoop(Math.max(nextLoop, actx.currentTime + 0.05));
  }
  function startMusic() {
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
        master = actx.createGain();
        master.gain.value = musicOn ? 0.2 : 0;
        master.connect(actx.destination);
        sfx = actx.createGain();
        sfx.gain.value = musicOn ? 0.9 : 0;
        sfx.connect(actx.destination);
        nextLoop = actx.currentTime + 0.1;
        setInterval(tick, 300);
      }
      if (actx.state === 'suspended') actx.resume();
      tick();
    } catch (e) {}
  }
  muBtn.addEventListener('click', function () {
    musicOn = !musicOn;
    muBtn.textContent = musicOn ? '🔊 Sonido' : '🔇 Sonido';
    if (master) master.gain.value = musicOn ? 0.2 : 0;
    if (sfx) sfx.gain.value = musicOn ? 0.9 : 0;
    if (musicOn) startMusic();
  });
  document.addEventListener('visibilitychange', function () {
    if (!actx) return;
    if (document.hidden) actx.suspend(); else if (musicOn) actx.resume();
  });

  newGame();
  var go = function () { requestAnimationFrame(loop); };
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('40px "Bagel Fat One"'), document.fonts.load('800 16px "Nunito"')]).then(go, go);
    setTimeout(function () {}, 0);
  } else go();
})();
</script>
</body>
</html>
