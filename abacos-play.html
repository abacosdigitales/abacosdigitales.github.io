<style>
  :root {
    --night: #0a1530;
    --panel: #12284f;
    --pink: #3ee0ff;
    --sun: #ffe14d;
    --mint: #7cf29a;
    --cream: #fff4e0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%;
    background: radial-gradient(120% 80% at 50% 0%, #14396e 0%, var(--night) 60%);
    color: var(--cream);
    font-family: "Nunito", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 10px;
  }
  .stage {
    position: relative; max-width: 480px; aspect-ratio: 2 / 3;
    width: min(100%, calc((100vh - 110px) * 0.6667));
    width: min(100%, calc((100dvh - 110px) * 0.6667));
  }
  .end {
    position: absolute; inset: 0; border-radius: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 12px; padding-bottom: 7%;
    opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .6s;
  }
  .end.on { opacity: 1; visibility: visible; }
  .end.on a, .end.on button { pointer-events: auto; }
  .wa {
    display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
    background: #25d366; color: #06361b; font: 800 18px "Nunito", system-ui, sans-serif;
    padding: 14px 26px; border-radius: 999px; box-shadow: 0 8px 24px rgba(37,211,102,.4);
  }
  #again { background: none; border: 0; color: var(--cream); font: 800 14px "Nunito", system-ui, sans-serif; text-decoration: underline; cursor: pointer; padding: 6px 10px; }
  canvas {
    width: 100%; height: 100%;
    border-radius: 18px; background: var(--night);
    box-shadow: 0 0 0 3px var(--pink), 0 20px 60px rgba(0,0,0,.5);
    touch-action: none; cursor: none; display: block;
  }
  #mu { font: 800 15px "Nunito", system-ui, sans-serif; color: var(--cream); background: var(--panel); border: 2px solid var(--pink); border-radius: 999px; padding: 8px 18px; cursor: pointer; }
  #mu:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .hint { margin: 0; font-size: 14px; opacity: .8; text-align: center; max-width: 440px; }
  @media (prefers-reduced-motion: reduce) { canvas { box-shadow: 0 0 0 3px var(--pink); } }
</style>
</head>

        var ox = BW / 2 + ball.r - Math.abs(dx), oy = BH / 2 + ball.r - Math.abs(dy);
        if (ox > 0 && oy > 0) {
          if (ox < oy) ball.vx = dx > 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
          else ball.vy = dy > 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
          b.alive = false;
          burst(b.x + BW / 2, b.y + BH / 2, b.color);
          popRandom();
          shake = 4;
          ball.speed = Math.min(7.4, ball.speed + 0.03);
          var m = Math.hypot(ball.vx, ball.vy);
          ball.vx = ball.vx / m * ball.speed; ball.vy = ball.vy / m * ball.speed;
          if (aliveCount() === 0) { win(); }
          break;
        }
      }
    }

    if (ball.y > H + 20) {
      lives--;
      if (lives <= 0) { lives = 3; say('¡Otra vez! Los ladrillos rotos se quedan'); }
      resetBall();
    }
  }

  function win() {
    state = 'win'; winT = 0;
    for (var i = 0; i < 160; i++) {
      confetti.push({ x: Math.random() * W, y: -Math.random() * H, vy: 1.5 + Math.random() * 3, vx: (Math.random() - 0.5) * 2,
        c: COLORS[i % COLORS.length], s: 4 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3 });
    }
  }

  function fitLine(l, maxW) {
    var size = l.s;
    ctx.font = size + 'px ' + DISPLAY;
    var w = ctx.measureText(l.t).width;
    if (w > maxW) size = Math.floor(size * maxW / w);
    return size;
  }

  function drawMessage() {
    ctx.fillStyle = '#12284f';
    rr(OX - 6, TOP - 6, W - 2 * OX + 12, AREA_H + 12, 12); ctx.fill();
    var centers = [TOP + 38, TOP + 110, TOP + 180, TOP + 250];
    ctx.save();
    ctx.beginPath();
    for (var q = 0; q < bricks.length; q++) {
      var bb = bricks[q];
      if (!bb.alive) ctx.rect(bb.x - GAP / 2, bb.y - GAP / 2, BW + GAP, BH + GAP);
    }
    ctx.clip();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (var i = 0; i < LINES.length; i++) {
      var l = LINES[i], size = fitLine(l, W - 2 * OX - 24);
      ctx.font = size + 'px ' + DISPLAY;
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillText(l.t, W / 2 + 2, centers[i] + 3);
      ctx.fillStyle = l.c; ctx.fillText(l.t, W / 2, centers[i]);
    }
    ctx.restore();
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function draw() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0a1530'; ctx.fillRect(0, 0, W, H);
    if (shake > 0) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.8; if (shake < 0.3) shake = 0; }

    // HUD
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.font = '800 16px ' + BODY; ctx.fillStyle = '#fff4e0';
    var left = aliveCount();
    ctx.fillText('Ladrillos: ' + left, 14, 30);
    ctx.textAlign = 'right';
    var hearts = ''; for (var h = 0; h < lives; h++) hearts += '♥ ';
    ctx.fillStyle = '#ff5252'; ctx.font = '800 22px ' + BODY;
    ctx.fillText(hearts, W - 14, 30);

    drawMessage();

    // ladrillos clásicos
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i]; if (!b.alive) continue;
      ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, BW, BH);
      ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(b.x, b.y, BW, 3); ctx.fillRect(b.x, b.y, 3, BH);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(b.x, b.y + BH - 3, BW, 3); ctx.fillRect(b.x + BW - 3, b.y, 3, BH);
      ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1; ctx.strokeRect(b.x + 0.5, b.y + 0.5, BW - 1, BH - 1);
    }

    // partículas
    for (var p = particles.length - 1; p >= 0; p--) {
      var q = particles[p];
      q.x += q.vx; q.y += q.vy; q.vy += 0.12; q.life--;
      if (q.life <= 0) { particles.splice(p, 1); continue; }
      ctx.globalAlpha = Math.min(1, q.life / 20);
      ctx.fillStyle = q.color; ctx.fillRect(q.x, q.y, q.size, q.size);
    }
    ctx.globalAlpha = 1;

    // paleta
    ctx.fillStyle = '#cfd8dc'; rr(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, 6); ctx.fill();
    ctx.fillStyle = '#e53935'; rr(paddle.x - paddle.w / 2, paddle.y, 16, paddle.h, 6); ctx.fill(); rr(paddle.x + paddle.w / 2 - 16, paddle.y, 16, paddle.h, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(paddle.x - paddle.w / 2 + 18, paddle.y + 2, paddle.w - 36, 3);

    // bola
    ctx.fillStyle = '#fff4e0'; ctx.shadowColor = '#3ee0ff'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    // mensajes de estado
    ctx.textAlign = 'center';
    if (state === 'play' && ball.held) {
      ctx.font = '800 16px ' + BODY; ctx.fillStyle = '#fff4e0';
      ctx.fillText('Tocá para lanzar', W / 2, H - 95);
    }
    if (toastT > 0) {
      toastT--;
      ctx.globalAlpha = Math.min(1, toastT / 30);
      ctx.font = '800 15px ' + BODY; ctx.fillStyle = '#ffd23f';
      ctx.fillText(toast, W / 2, H - 120);
      ctx.globalAlpha = 1;
    }

    // final
    if (state === 'win') {
      winT++;
      if (winT === 200) endui.classList.add('on');
      var ov = Math.max(0, Math.min(1, (winT - 110) / 50));
      ctx.fillStyle = 'rgba(10,21,48,' + (0.94 * ov) + ')'; ctx.fillRect(0, 0, W, H);
      var la = Math.max(0, Math.min(1, (winT - 130) / 50));
      if (la > 0 && logo.complete && logo.naturalWidth) {
        ctx.globalAlpha = la; ctx.globalCompositeOperation = 'lighten';
        ctx.drawImage(logo, 90, 30, 300, 300);
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      }
      var ta = Math.max(0, Math.min(1, (winT - 150) / 50));
      if (ta > 0) {
        ctx.globalAlpha = ta; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '32px ' + DISPLAY; ctx.fillStyle = '#fff4e0'; ctx.fillText('¿Querés saber más de', W / 2, 372);
        ctx.font = '54px ' + DISPLAY; ctx.fillStyle = '#ffe14d'; ctx.fillText('Ábacos Play?', W / 2, 428);
        ctx.font = '800 16px ' + BODY; ctx.fillStyle = '#fff4e0'; ctx.fillText('Escribime por WhatsApp y te cuento todo', W / 2, 480);
        ctx.globalAlpha = 1;
      }
      for (var k = 0; k < confetti.length; k++) {
        var f = confetti[k];
        f.y += f.vy; f.x += f.vx; f.rot += f.vr;
        if (f.y > H + 10) { f.y = -10; f.x = Math.random() * W; }
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
        ctx.fillStyle = f.c; ctx.fillRect(-f.s / 2, -f.s / 4, f.s, f.s / 2); ctx.restore();
      }
    }
    ctx.restore();
  }

  function loop() { step(); draw(); requestAnimationFrame(loop); }

  // ---- Música: Cumpleaños Feliz sintetizado, en bucle ----
  var actx = null, master = null, sfx = null, musicOn = true, nextLoop = 0, BEAT = 0.5;
  var TUNE = [[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],
              [392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
              [392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,1],
              [698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
  var muBtn = document.getElementById('mu');

  function note(freq, t, dur) {
    var o = actx.createOscillator(), o2 = actx.createOscillator();
    var g = actx.createGain(), g2 = actx.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    o2.type = 'sine'; o2.frequency.value = freq * 2; g2.gain.value = 0.25;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.6, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.3);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    o.start(t); o2.start(t); o.stop(t + dur + 0.4); o2.stop(t + dur + 0.4);
  }
  function scheduleLoop(t0) {
    var t = t0;
    for (var i = 0; i < TUNE.length; i++) { note(TUNE[i][0], t, TUNE[i][1] * BEAT); t += TUNE[i][1] * BEAT; }
    return t + BEAT * 1.5;
  }
  function popSound() {
    if (!actx || !sfx || actx.state !== 'running') return;
    var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(300 + Math.floor(Math.random() * 5) * 90, t);
    o.frequency.exponentialRampToValueAtTime(120, t + 0.09);
    g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(g); g.connect(sfx); o.start(t); o.stop(t + 0.12);
  }
  function tick() {
    if (!actx || actx.state !== 'running') return;
    if (nextLoop - actx.currentTime < 1.5) nextLoop = scheduleLoop(Math.max(nextLoop, actx.currentTime + 0.05));
  }
  function startMusic() {
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
        master = actx.createGain();
        master.gain.value = musicOn ? 0.2 : 0;
        master.connect(actx.destination);
        sfx = actx.createGain();
        sfx.gain.value = musicOn ? 0.9 : 0;
        sfx.connect(actx.destination);
        nextLoop = actx.currentTime + 0.1;
        setInterval(tick, 300);
      }
      if (actx.state === 'suspended') actx.resume();
      tick();
    } catch (e) {}
  }
  muBtn.addEventListener('click', function () {
    musicOn = !musicOn;
    muBtn.textContent = musicOn ? '🔊 Sonido' : '🔇 Sonido';
    if (master) master.gain.value = musicOn ? 0.2 : 0;
    if (sfx) sfx.gain.value = musicOn ? 0.9 : 0;
    if (musicOn) startMusic();
  });
  document.addEventListener('visibilitychange', function () {
    if (!actx) return;
    if (document.hidden) actx.suspend(); else if (musicOn) actx.resume();
  });

  document.getElementById('again').addEventListener('click', function () { newGame(); });
  newGame();
  var go = function () { requestAnimationFrame(loop); };
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('40px "Bagel Fat One"'), document.fonts.load('800 16px "Nunito"')]).then(go, go);
    setTimeout(function () {}, 0);
  } else go();
})();
</script>
</body>
