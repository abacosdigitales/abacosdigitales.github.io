<style>
  :root{
    --bg: #F6F1E7;
    --surface: #FBF8F2;
    --ink: #241F16;
    --ink-soft: #6B6152;
    --line: #DCD2B9;
    --gold: #A9772F;
    --gold-soft: #F1E3C6;
    --teal: #33564A;
    --teal-soft: #E1E9E3;
    --rust: #8C3B2E;
    --rust-soft: #F1DFDA;
    --serif: "Iowan Old Style", "Palatino Linotype", "URW Palladio L", Georgia, serif;
    --sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  #app{ min-height: 100vh; }
  .loading{ padding: 4rem 2rem; font-family: var(--serif); font-size: 1.2rem; color: var(--ink-soft); }

  /* ---------- Auth screen ---------- */
  .auth-wrap{
    min-height: 60vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 2rem 1.25rem;
  }
  .site-banner{ width:100%; overflow:hidden; line-height:0; background: var(--ink); }
  .site-banner img{ width:100%; height:auto; display:block; object-fit:cover; object-position: center 8%; }
  .site-banner.large img{ max-height:340px; }
  .site-banner.compact img{ max-height:90px; }
  .auth-card{
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .auth-title{
    font-family: var(--serif);
    font-size: 2rem;
    line-height: 1.15;
    margin: 0 0 0.15rem 0;
  }
  .auth-sub{
    color: var(--ink-soft);
    margin: 0 0 2rem 0;
    font-size: 0.95rem;
  }
  .google-btn{
    display:inline-flex; align-items:center; gap: 0.65rem;
    font-family: var(--sans);
    font-size: 0.95rem;
    padding: 0.65rem 1.4rem;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 3px;
    cursor: pointer;
  }
  .google-btn:hover{ background: #fff; }
  .not-auth-email{ font-family: var(--sans); color: var(--ink-soft); font-size: 0.9rem; margin: 0.6rem 0 1.6rem 0; }

  label{ display:block; font-size: 0.85rem; color: var(--ink-soft); margin: 0.9rem 0 0.3rem 0; text-align:left; }
  input[type=text], input[type=password], input[type=url], input[type=email], textarea, select{
    width:100%;
    font-family: var(--sans);
    font-size: 0.98rem;
    padding: 0.55rem 0.6rem;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink);
  }
  textarea{ min-height: 4.5rem; resize: vertical; }
  .btn{
    font-family: var(--sans);
    font-size: 0.92rem;
    padding: 0.55rem 1.1rem;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--bg);
    border-radius: 3px;
    cursor: pointer;
  }
  .btn:hover{ opacity: 0.88; }
  .btn.secondary{
    background: transparent; color: var(--ink); border: 1px solid var(--line);
  }
  .btn.gold{ background: var(--gold); border-color: var(--gold); color: #fff; }
  .btn.small{ font-size: 0.8rem; padding: 0.32rem 0.7rem; }
  .link-btn{
    background:none; border:none; padding:0; color: var(--rust); cursor:pointer;
    font-size: 0.8rem; text-decoration: underline;
  }
  .form-actions{ margin-top: 1.4rem; text-align:left; }
  .form-error{ color: var(--rust); font-size: 0.85rem; margin-top: 0.6rem; }
  .form-note{ color: var(--ink-soft); font-size: 0.8rem; margin-top: 0.35rem; }

  /* ---------- App shell ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .brand{ font-family: var(--serif); font-size: 1.25rem; }
  .who{ display:flex; align-items:center; gap: 0.9rem; font-size: 0.85rem; color: var(--ink-soft); }
  .who .name{ color: var(--ink); }
  .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background: var(--gold); margin-right: 0.4rem; }

  .layout{ display:flex; align-items:flex-start; max-width: 1100px; margin: 0 auto; }
  .sidebar{
    width: 260px; flex-shrink: 0;
    border-right: 1px solid var(--line);
    min-height: calc(100vh - 61px);
    padding: 1.25rem 0;
  }
  .sidebar-heading{
    padding: 0 1.25rem 0.6rem 1.25rem;
    font-size: 0.82rem; color: var(--ink-soft);
  }
  .class-item{
    display:flex; align-items:center; gap: 0.55rem;
    padding: 0.65rem 1.25rem;
    border-left: 3px solid transparent;
    cursor: pointer;
    font-size: 0.94rem;
  }
  .class-item:hover{ background: rgba(0,0,0,0.02); }
  .class-item.active{ border-left-color: var(--gold); background: var(--gold-soft); }
  .class-item .mark{ color: var(--teal); width: 1rem; text-align:center; flex-shrink:0; }
  .tabs-teacher{ display:flex; gap: 0; border-bottom: 1px solid var(--line); padding: 0 1.25rem; }
  .tabs-teacher .tab-btn{ padding: 0.75rem 0.9rem 0.7rem 0; }
  .tab-btn{
    background:none; border:none; cursor:pointer;
    font-family: var(--sans); font-size: 0.95rem; color: var(--ink-soft);
    padding: 0.5rem 0 0.75rem 0;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active{ color: var(--ink); border-bottom-color: var(--gold); }

  .main{ flex: 1; padding: 1.75rem 2rem 4rem 2rem; min-width: 0; }
  .greeting{ font-family: var(--serif); font-size: 1.4rem; margin: 0 0 1.25rem 0; }
  .empty{ color: var(--ink-soft); font-family: var(--serif); font-size: 1.1rem; padding: 3rem 0; }

  .class-meta{ color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 0.15rem 0; }
  .class-title{ font-family: var(--serif); font-size: 1.7rem; margin: 0 0 0.9rem 0; }
  .class-desc{ line-height: 1.55; margin-bottom: 1.4rem; max-width: 62ch; }

  .resource{ margin-bottom: 1.75rem; }
  .video-embed{ position:relative; padding-top: 56.25%; border: 1px solid var(--line); background:#000; }
  .video-embed iframe{ position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
  .manual-link{
    display:inline-block; margin-top: 0.5rem;
    color: var(--ink); border-bottom: 1px solid var(--gold);
    text-decoration:none; font-size: 0.95rem;
  }

  .section-heading{ font-family: var(--serif); font-size: 1.15rem; margin: 2rem 0 0.6rem 0; }

  .activity{ border-top: 1px solid var(--line); padding: 1.1rem 0; }
  .activity-type{ font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 0.35rem; }
  .activity-prompt{ font-size: 1rem; margin: 0 0 0.7rem 0; max-width: 62ch; }
  .option-row{ display:flex; align-items:center; gap:0.5rem; padding: 0.3rem 0; font-size: 0.94rem; }
  .option-row input{ width:auto; }
  .feedback-ok{ color: var(--teal); font-size: 0.88rem; margin-top: 0.5rem; }
  .feedback-bad{ color: var(--rust); font-size: 0.88rem; margin-top: 0.5rem; }
  .checklist-row{ display:flex; align-items:center; gap: 0.7rem; }
  .teacher-del{ margin-left: 0.75rem; }

  .newclass-box{
    border: 1px solid var(--line); background: var(--surface);
    padding: 1.25rem; margin-bottom: 2rem; max-width: 560px;
  }
  .newclass-box h3{ font-family: var(--serif); font-size: 1.15rem; margin: 0 0 0.9rem 0; font-weight: normal; }

  table.progress-table{ border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  table.progress-table th, table.progress-table td{
    border-bottom: 1px solid var(--line);
    padding: 0.55rem 0.7rem; text-align: left;
  }
  table.progress-table th{ color: var(--ink-soft); font-weight: normal; }
  .student-name-btn{ background:none; border:none; padding:0; cursor:pointer; color: var(--ink); text-decoration: underline; font-size: 0.9rem; }
  .student-detail{ background: var(--surface); border: 1px solid var(--line); padding: 1rem 1.25rem; margin: 0.5rem 0 1.5rem 0; }
  .student-detail h4{ font-family: var(--serif); font-weight: normal; margin: 0.8rem 0 0.3rem 0; font-size: 1rem; }
  .student-detail p{ margin: 0.2rem 0; font-size: 0.88rem; }

  .allow-row{ display:flex; align-items:center; justify-content:space-between; border-top: 1px solid var(--line); padding: 0.6rem 0; font-size: 0.92rem; max-width: 480px; }

  .toast{
    position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 0.6rem 1.1rem;
    border-radius: 3px; font-size: 0.85rem;
  }

  .whatsapp-fab{
    position: fixed; bottom: 22px; right: 22px;
    width: 56px; height: 56px; border-radius: 50%;
    background: #25D366;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.28);
    z-index: 40;
  }
  .whatsapp-fab:hover{ opacity: 0.92; }

  .site-footer{
    border-top: 1px solid var(--line);
    background: var(--surface);
    padding: 1.5rem 1.25rem 5rem 1.25rem;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.82rem;
    line-height: 1.55;
  }
  .site-footer p{ margin: 0 0 0.6rem 0; }
  .site-footer .footer-note{ max-width: 60ch; margin: 0 auto; font-size: 0.78rem; }

  .mobile-class-select{ display:none; }

  @media (max-width: 760px){
    .layout{ flex-direction: column; }
    .sidebar{ width: 100%; border-right: none; border-bottom: 1px solid var(--line); min-height:auto; padding: 1rem 0; }
    .main{ padding: 1.25rem 1.1rem 3rem 1.1rem; }
    .desktop-class-list{ display:none; }
    .mobile-class-select{
      display:block; width: calc(100% - 2.5rem); margin: 0 1.25rem;
      font-family: var(--sans); font-size: 0.95rem;
      padding: 0.6rem 0.65rem; border: 1px solid var(--line); border-radius: 3px;
      background: var(--surface); color: var(--ink);
    }
  }
</style>
</head>
