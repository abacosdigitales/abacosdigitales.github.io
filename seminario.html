const STATE = {
  loading: true,
  authStatus: "checking", // checking | signed-out | not-authorized | ok
  user: null,
  classes: [],
  progress: {},
  allProgress: {},
  profiles: [],
  allowlist: [],
  selectedClassId: null,
  teacherTab: "clases", // clases | progreso | alumnos
  editingClassId: null,
  expandedStudent: null,
  toast: ""
};

function escapeHtml(str){
  return String(str == null ? "" : str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function showToast(msg){
  STATE.toast = msg;
  render();
  setTimeout(()=>{ STATE.toast=""; render(); }, 2200);
}

function isTeacherEmail(email){
  return TEACHER_EMAILS.map(e => e.toLowerCase()).includes((email || "").toLowerCase());
}

/* ---------------- Firestore helpers ---------------- */
async function getClasses(){
  try{ const doc = await db.collection("app").doc("classes").get(); return doc.exists ? (doc.data().list || []) : []; }
  catch(e){ console.error(e); return []; }
}
async function saveClasses(){
  try{ await db.collection("app").doc("classes").set({ list: STATE.classes }); }
  catch(e){ console.error(e); showToast("No se pudo guardar (revisá los permisos de Firestore)."); }
}

async function getOwnProgress(uid){
  try{ const doc = await db.collection("progress").doc(uid).get(); return doc.exists ? (doc.data().data || {}) : {}; }
  catch(e){ return {}; }
}
async function saveOwnProgress(){
  try{ await db.collection("progress").doc(STATE.user.uid).set({ data: STATE.progress }); }
  catch(e){ console.error(e); }
}

async function upsertProfile(fbUser, role){
  try{
    await db.collection("profiles").doc(fbUser.uid).set({
      email: fbUser.email,
      displayName: fbUser.displayName || fbUser.email,
      role,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  }catch(e){ console.error(e); }
}

async function isEmailAllowlisted(email){
  try{ const doc = await db.collection("allowlist").doc(email.toLowerCase()).get(); return doc.exists; }
  catch(e){ return false; }
}
async function loadAllowlist(){
  try{ const snap = await db.collection("allowlist").get(); STATE.allowlist = snap.docs.map(d => ({ email: d.id, ...d.data() })); }
  catch(e){ STATE.allowlist = []; }
}
async function addAllowedEmail(form){
  const email = form.email.value.trim().toLowerCase();
  if(!email){ return; }
  try{
    await db.collection("allowlist").doc(email).set({ addedAt: firebase.firestore.FieldValue.serverTimestamp() });
    form.reset();
    await loadAllowlist();
    showToast("Alumno autorizado.");
    render();
  }catch(e){ showToast("No se pudo agregar."); }
}
async function removeAllowedEmail(email){
  try{ await db.collection("allowlist").doc(email).delete(); await loadAllowlist(); render(); }
  catch(e){ showToast("No se pudo quitar."); }
}

async function loadStudentProfiles(){
  try{
    const snap = await db.collection("profiles").where("role", "==", "alumno").get();
    STATE.profiles = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
  }catch(e){ STATE.profiles = []; }
}
async function loadAllProgress(){
  const result = {};
  for(const p of STATE.profiles){
    result[p.uid] = await getOwnProgress(p.uid);
  }
  STATE.allProgress = result;
}

/* ---------------- Auth ---------------- */
function signInWithGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => {
    console.error(err);
    showToast("No se pudo iniciar sesión con Google.");
  });
}
function logout(){ auth.signOut(); }

auth.onAuthStateChanged(async (fbUser) => {
  if(!fbUser){
    STATE.user = null;
    STATE.authStatus = "signed-out";
    STATE.loading = false;
    render();
    return;
  }
  STATE.loading = true;
  render();

  let role = null;
  if(isTeacherEmail(fbUser.email)) role = "profesor";
  else if(await isEmailAllowlisted(fbUser.email)) role = "alumno";

  if(!role){
    STATE.user = { email: fbUser.email };
    STATE.authStatus = "not-authorized";
    STATE.loading = false;
    render();
    return;
  }

  await upsertProfile(fbUser, role);
  STATE.user = { uid: fbUser.uid, email: fbUser.email, displayName: fbUser.displayName || fbUser.email, role };
  STATE.classes = await getClasses();
  if(role === "alumno"){
    STATE.progress = await getOwnProgress(fbUser.uid);
    if(STATE.classes.length) STATE.selectedClassId = STATE.classes[0].id;
  } else {
    STATE.teacherTab = "clases";
  }
  STATE.authStatus = "ok";
  STATE.loading = false;
  render();
});

/* ---------------- Teacher: classes & activities ---------------- */
async function addClass(form){
  const title = form.title.value.trim();
  const description = form.description.value.trim();
  const videoUrl = form.videoUrl.value.trim();
  const manualUrl = form.manualUrl.value.trim();
  if(!title){ showToast("Ponle un título a la clase."); return; }
  const newClass = { id: "c" + Date.now(), title, description, videoUrl, manualUrl, activities: [] };
  STATE.classes.push(newClass);
  await saveClasses();
  form.reset();
  STATE.selectedClassId = newClass.id;
  showToast("Clase creada.");
}

async function deleteClass(classId){
  if(!confirm("¿Eliminar esta clase y sus actividades?")) return;
  STATE.classes = STATE.classes.filter(c => c.id !== classId);
  await saveClasses();
  if(STATE.selectedClassId === classId) STATE.selectedClassId = STATE.classes[0] ? STATE.classes[0].id : null;
  render();
}

async function editClass(classId, form){
  const cls = STATE.classes.find(c => c.id === classId);
  if(!cls) return;
  const title = form.title.value.trim();
  if(!title){ showToast("Ponle un título a la clase."); return; }
  cls.title = title;
  cls.description = form.description.value.trim();
  cls.videoUrl = form.videoUrl.value.trim();
  cls.manualUrl = form.manualUrl.value.trim();
  await saveClasses();
  STATE.editingClassId = null;
  showToast("Clase actualizada.");
}

async function importLessons(){
  const msg = STATE.classes.length
    ? `Esto agregará ${OT_LESSONS.length} lecciones a tu lista de clases actual. ¿Continuar?`
    : `Se cargarán ${OT_LESSONS.length} lecciones del Antiguo Testamento como clases. Vas a poder editar títulos y agregar videos y actividades después. ¿Continuar?`;
  if(!confirm(msg)) return;
  const already = new Set(STATE.classes.map(c => c.id));
  let added = 0;
  OT_LESSONS.forEach((l, idx) => {
    const id = "seed-" + idx;
    if(already.has(id)) return;
    STATE.classes.push({ id, title: l.title, description: l.description, videoUrl: "", manualUrl: l.url, activities: [] });
    added++;
  });
  await saveClasses();
  showToast(added ? `${added} lecciones importadas.` : "Esas lecciones ya estaban importadas.");
}

async function addActivity(classId, form){
  const cls = STATE.classes.find(c => c.id === classId);
  if(!cls) return;
  const type = form.type.value;
  const prompt = form.prompt.value.trim();
  if(!prompt){ showToast("Escribe el enunciado de la actividad."); return; }

  const activity = { id: "a" + Date.now(), type, prompt };

  if(type === "quiz"){
    const raw = [form.opt1.value, form.opt2.value, form.opt3.value, form.opt4.value];
    const correctRaw = form.correct.value === "" ? -1 : parseInt(form.correct.value, 10);
    const options = [];
    const map = {};
    raw.forEach((val, i) => {
      const v = val.trim();
      if(v !== ""){ map[i] = options.length; options.push(v); }
    });
    if(options.length < 2){ showToast("Agrega al menos dos opciones."); return; }
    if(!(correctRaw in map)){ showToast("La respuesta correcta debe tener texto."); return; }
    activity.options = options;
    activity.correctIndex = map[correctRaw];
  }

  cls.activities.push(activity);
  await saveClasses();
  form.reset();
  showToast("Actividad agregada.");
}

async function deleteActivity(classId, activityId){
  const cls = STATE.classes.find(c => c.id === classId);
  if(!cls) return;
  cls.activities = cls.activities.filter(a => a.id !== activityId);
  await saveClasses();
  render();
}

/* ---------------- Student: progress ---------------- */
async function toggleChecklist(classId, activityId){
  STATE.progress[classId] = STATE.progress[classId] || {};
  const current = STATE.progress[classId][activityId] || {};
  STATE.progress[classId][activityId] = { ...current, done: !current.done };
  await saveOwnProgress();
  render();
}

async function answerQuiz(classId, activityId, selectedIndex){
  const cls = STATE.classes.find(c => c.id === classId);
  const act = cls.activities.find(a => a.id === activityId);
  const correct = selectedIndex === act.correctIndex;
  STATE.progress[classId] = STATE.progress[classId] || {};
  STATE.progress[classId][activityId] = { done: true, answer: selectedIndex, correct };
  await saveOwnProgress();
  render();
}

async function submitReflection(classId, activityId, text){
  const t = text.trim();
  if(!t){ showToast("Escribe tu respuesta antes de guardar."); return; }
  STATE.progress[classId] = STATE.progress[classId] || {};
  STATE.progress[classId][activityId] = { done: true, answer: t };
  await saveOwnProgress();
  showToast("Respuesta guardada.");
}

function classCompletion(progressForUser, cls){
  if(!cls.activities.length) return null;
  const p = (progressForUser && progressForUser[cls.id]) || {};
  const done = cls.activities.filter(a => p[a.id] && p[a.id].done).length;
  return Math.round((done / cls.activities.length) * 100);
}

function overallCompletion(progressForUser){
  let total = 0, done = 0;
  STATE.classes.forEach(c => {
    if(!c.activities.length) return;
    total += c.activities.length;
    const p = (progressForUser && progressForUser[c.id]) || {};
    done += c.activities.filter(a => p[a.id] && p[a.id].done).length;
  });
  if(total === 0) return null;
  return Math.round((done / total) * 100);
}

/* ---------------- Rendering ---------------- */
function render(){
  const app = document.getElementById("app");
  if(STATE.loading){ app.innerHTML = '<div class="loading">Cargando el campus…</div>'; return; }
  let body;
  if(STATE.authStatus === "signed-out") body = renderLogin();
  else if(STATE.authStatus === "not-authorized") body = renderNotAuthorized();
  else body = renderShell();
  app.innerHTML = body + (STATE.toast ? `<div class="toast">${escapeHtml(STATE.toast)}</div>` : "");
}

  <div class="auth-wrap">

    <div class="main">${isTeacher ? renderTeacherMain() : renderStudentMain()}</div>
  </div>`;

/* ---- Student sidebar / main ---- */
function renderStudentSidebar(){
  if(!STATE.classes.length) return `<div class="sidebar"><p class="sidebar-heading">Todavía no hay clases publicadas.</p></div>`;
  const items = STATE.classes.map((c, i) => {
    const p = STATE.progress[c.id] || {};
    const total = c.activities.length;
    const done = c.activities.filter(a => p[a.id] && p[a.id].done).length;
    const complete = total > 0 && done === total;
    return `
      <div class="class-item ${c.id === STATE.selectedClassId ? "active" : ""}" data-action="select-class" data-id="${c.id}">
        <span class="mark">${complete ? "✓" : ""}</span>
        <span>Clase ${i + 1}: ${escapeHtml(c.title)}</span>
      </div>`;
  }).join("");
  return `<div class="sidebar"><p class="sidebar-heading">Índice del curso</p>${items}</div>`;
}

function renderStudentMain(){
  const cls = STATE.classes.find(c => c.id === STATE.selectedClassId);
  if(!cls) return `<p class="empty">Elige una clase del índice para comenzar.</p>`;
  const idx = STATE.classes.findIndex(c => c.id === cls.id) + 1;
  const p = STATE.progress[cls.id] || {};

  let resourceHtml = "";
  if(cls.videoUrl){
    const yt = extractYoutubeId(cls.videoUrl);
    resourceHtml += `<div class="resource">` +
      (yt ? `<div class="video-embed"><iframe src="https://www.youtube.com/embed/${yt}" allowfullscreen></iframe></div>`
          : `<a class="manual-link" href="${escapeHtml(cls.videoUrl)}" target="_blank" rel="noopener">Ver video</a>`) +
      `</div>`;
  }
  if(cls.manualUrl){
    resourceHtml += `<div class="resource"><a class="manual-link" href="${escapeHtml(cls.manualUrl)}" target="_blank" rel="noopener">Abrir en el manual</a></div>`;
  }

  const activitiesHtml = cls.activities.length ? cls.activities.map(a => renderActivity(cls, a, p[a.id])).join("") :
    `<p class="form-note">El profesor todavía no agregó actividades para esta clase.</p>`;

  return `
    <p class="class-meta">Clase ${idx} de ${STATE.classes.length}</p>
    <h2 class="class-title">${escapeHtml(cls.title)}</h2>
    ${cls.description ? `<p class="class-desc">${escapeHtml(cls.description)}</p>` : ""}
    ${resourceHtml}
    <h3 class="section-heading">Actividades del día</h3>
    ${activitiesHtml}
  `;
}

function renderActivity(cls, act, state){
  state = state || {};
  const typeLabel = act.type === "quiz" ? "Cuestionario" : act.type === "checklist" ? "Lectura" : "Reflexión";
  let body = "";

  if(act.type === "quiz"){
    if(state.done){
      const chosen = act.options[state.answer];
      body = `<p>${escapeHtml(chosen)}</p>` +
        (state.correct ? `<p class="feedback-ok">Correcto.</p>` : `<p class="feedback-bad">Incorrecto. La respuesta correcta era: ${escapeHtml(act.options[act.correctIndex])}</p>`);
    } else {
      body = act.options.map((opt, i) => `
        <div class="option-row">
          <input type="radio" name="quiz-${act.id}" id="quiz-${act.id}-${i}" data-action="answer-quiz" data-class="${cls.id}" data-activity="${act.id}" data-index="${i}">
          <label for="quiz-${act.id}-${i}" style="margin:0;color:var(--ink);font-size:0.94rem;">${escapeHtml(opt)}</label>
        </div>`).join("");
    }
  } else if(act.type === "checklist"){
    body = `
      <div class="checklist-row">
        <button class="btn ${state.done ? "secondary" : "gold"} small" data-action="toggle-checklist" data-class="${cls.id}" data-activity="${act.id}">
          ${state.done ? "Marcada como leída" : "Marcar como leída"}
        </button>
        ${state.done ? '<span class="feedback-ok">Completado</span>' : ""}
      </div>`;
  } else {
    body = `
      <form data-action="reflection" data-class="${cls.id}" data-activity="${act.id}">
        <textarea name="answer" placeholder="Escribe tu respuesta...">${escapeHtml(state.answer || "")}</textarea>
        <div class="form-actions"><button type="submit" class="btn small gold">Guardar respuesta</button></div>
      </form>`;
  }

  return `
    <div class="activity">
      <p class="activity-type">${typeLabel}</p>
      <p class="activity-prompt">${escapeHtml(act.prompt)}</p>
      ${body}
    </div>`;
}

/* ---- Teacher sidebar / main ---- */
function renderTeacherSidebar(){
  const items = STATE.classes.map((c, i) => `<div class="class-item" style="cursor:default;"><span>Clase ${i + 1}: ${escapeHtml(c.title)}</span></div>`).join("");
  return `<div class="sidebar"><p class="sidebar-heading">Clases publicadas</p>${items || '<p class="sidebar-heading">Aún no hay clases.</p>'}</div>`;
}

function renderTeacherMain(){
  const tabs = `
    <div class="tabs-teacher">
      <button class="tab-btn ${STATE.teacherTab === "clases" ? "active" : ""}" data-action="teacher-tab" data-tab="clases">Clases</button>
      <button class="tab-btn ${STATE.teacherTab === "progreso" ? "active" : ""}" data-action="teacher-tab" data-tab="progreso">Progreso de alumnos</button>
      <button class="tab-btn ${STATE.teacherTab === "alumnos" ? "active" : ""}" data-action="teacher-tab" data-tab="alumnos">Alumnos autorizados</button>
    </div>`;
  let content;
  if(STATE.teacherTab === "clases") content = renderTeacherClasses();
  else if(STATE.teacherTab === "progreso") content = renderTeacherProgress();
  else content = renderTeacherAllowlist();
  return tabs + content;
}

function renderTeacherClasses(){
  const newClassForm = `
    <div class="newclass-box">
      <h3>Nueva clase</h3>
      <form data-action="add-class">
        <label>Título</label>
        <input type="text" name="title" required>
        <label>Descripción (opcional)</label>
        <textarea name="description"></textarea>
        <label>Video de YouTube (opcional)</label>
        <input type="url" name="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
        <label>Enlace al manual (opcional)</label>
        <input type="url" name="manualUrl" placeholder="https://...">
        <div class="form-actions"><button type="submit" class="btn gold">Crear clase</button></div>
      </form>
    </div>
    <div class="newclass-box">
      <h3>Importar plan de estudio</h3>
      <p class="form-note">Carga de una sola vez las ${OT_LESSONS.length} lecciones del Manual del alumno de Seminario 2026 (Antiguo Testamento), con su enlace al manual online ya incluido. Podés revisar y ajustar los títulos después.</p>
      <div class="form-actions"><button type="button" class="btn secondary" data-action="import-lessons">Importar las ${OT_LESSONS.length} lecciones</button></div>
    </div>`;

  const classesHtml = STATE.classes.map((c, i) => {
    if(STATE.editingClassId === c.id){
      return `
      <div style="border-top:1px solid var(--line); padding: 1.25rem 0;">
        <p class="class-meta">Clase ${i + 1} — editando</p>
        <form data-action="edit-class" data-class="${c.id}" style="max-width:560px;">
          <label>Título</label>
          <input type="text" name="title" value="${escapeHtml(c.title)}" required>
          <label>Descripción (opcional)</label>
          <textarea name="description">${escapeHtml(c.description || "")}</textarea>
          <label>Video de YouTube (opcional)</label>
          <input type="url" name="videoUrl" value="${escapeHtml(c.videoUrl || "")}">
          <label>Enlace al manual (opcional)</label>
          <input type="url" name="manualUrl" value="${escapeHtml(c.manualUrl || "")}">
          <div class="form-actions">
            <button type="submit" class="btn small gold">Guardar cambios</button>
            <button type="button" class="btn small secondary" data-action="cancel-edit-class">Cancelar</button>
          </div>
        </form>
      </div>`;
    }
    return `
    <div style="border-top:1px solid var(--line); padding: 1.25rem 0;">
      <p class="class-meta">Clase ${i + 1}
        <button class="link-btn teacher-del" data-action="edit-class-toggle" data-id="${c.id}" style="color:var(--ink-soft);">Editar</button>
        <button class="link-btn teacher-del" data-action="delete-class" data-id="${c.id}">Eliminar clase</button>
      </p>
      <h3 class="class-title" style="font-size:1.35rem;">${escapeHtml(c.title)}</h3>
      ${c.description ? `<p class="class-desc">${escapeHtml(c.description)}</p>` : ""}
      ${c.videoUrl ? `<p class="form-note">Video: ${escapeHtml(c.videoUrl)}</p>` : ""}
      ${c.manualUrl ? `<p class="form-note">Manual: ${escapeHtml(c.manualUrl)}</p>` : ""}
      <h4 style="font-family:var(--serif); font-weight:normal; margin: 1rem 0 0.4rem 0;">Actividades</h4>
      ${c.activities.map(a => `
        <div class="activity" style="padding:0.7rem 0;">
          <p class="activity-type">${a.type === "quiz" ? "Cuestionario" : a.type === "checklist" ? "Lectura" : "Reflexión"}
            <button class="link-btn teacher-del" data-action="delete-activity" data-class="${c.id}" data-activity="${a.id}">Eliminar</button>
          </p>
          <p class="activity-prompt">${escapeHtml(a.prompt)}</p>
          ${a.options ? `<p class="form-note">Opciones: ${a.options.map(escapeHtml).join(" / ")} — Correcta: ${escapeHtml(a.options[a.correctIndex])}</p>` : ""}
        </div>`).join("") || `<p class="form-note">Sin actividades todavía.</p>`}
      <form data-action="add-activity" data-class="${c.id}" style="margin-top:1rem; max-width:480px;">
        <label>Tipo de actividad</label>
        <select name="type">
          <option value="quiz">Cuestionario (opción múltiple)</option>
          <option value="checklist">Lectura (marcar como completada)</option>
          <option value="reflection">Reflexión (respuesta escrita)</option>
        </select>
        <label>Enunciado</label>
        <textarea name="prompt" required></textarea>
        <label>Opciones (solo para cuestionario)</label>
        <input type="text" name="opt1" placeholder="Opción 1">
        <div class="option-row"><input type="radio" name="correct" value="0"><span>Es correcta</span></div>
        <input type="text" name="opt2" placeholder="Opción 2">
        <div class="option-row"><input type="radio" name="correct" value="1"><span>Es correcta</span></div>
        <input type="text" name="opt3" placeholder="Opción 3 (opcional)">
        <div class="option-row"><input type="radio" name="correct" value="2"><span>Es correcta</span></div>
        <input type="text" name="opt4" placeholder="Opción 4 (opcional)">
        <div class="option-row"><input type="radio" name="correct" value="3"><span>Es correcta</span></div>
        <div class="form-actions"><button type="submit" class="btn small gold">Agregar actividad</button></div>
      </form>
    </div>`;
  }).join("");

  return newClassForm + classesHtml;
}

function renderTeacherProgress(){
  if(!STATE.profiles.length) return `<p class="empty" style="margin-top:1.5rem;">Todavía no hay alumnos que hayan ingresado.</p>`;
  if(!STATE.classes.length) return `<p class="empty" style="margin-top:1.5rem;">Crea al menos una clase para ver el progreso.</p>`;

  const withOverall = STATE.profiles.map(p => {
    const prog = STATE.allProgress[p.uid] || {};
    return { profile: p, prog, overall: overallCompletion(prog) };
  });
  withOverall.sort((a, b) => (a.overall === null ? -1 : a.overall) - (b.overall === null ? -1 : b.overall));

  const rows = withOverall.map(({ profile: p, prog, overall }) => {
    const cells = STATE.classes.map(c => {
      const pct = classCompletion(prog, c);
      return `<td>${pct === null ? "—" : pct + "%"}</td>`;
    }).join("");
    return `
      <tr>
        <td><button class="student-name-btn" data-action="toggle-student" data-uid="${p.uid}">${escapeHtml(p.displayName || p.email)}</button></td>
        <td><strong>${overall === null ? "—" : overall + "%"}</strong></td>
        ${cells}
      </tr>
      ${STATE.expandedStudent === p.uid ? renderStudentDetail(p, prog) : ""}
    `;
  }).join("");

  const headerCells = STATE.classes.map((c, i) => `<th>Clase ${i + 1}</th>`).join("");

  return `
    <p class="form-note" style="margin-top:1.5rem;">Ordenado de menor a mayor avance total, para detectar rápido quién necesita un empujón.</p>
    <div style="overflow-x:auto;">
      <table class="progress-table">
        <thead><tr><th>Alumno</th><th>Avance total</th>${headerCells}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderStudentDetail(profile, prog){
  const blocks = STATE.classes.map((c, i) => {
    if(!c.activities.length) return "";
    const lines = c.activities.map(a => {
      const s = prog[c.id] && prog[c.id][a.id];
      if(!s || !s.done) return `<p>${escapeHtml(a.prompt)} — sin completar</p>`;
      if(a.type === "reflection") return `<p>${escapeHtml(a.prompt)} — "${escapeHtml(s.answer)}"</p>`;
      if(a.type === "quiz") return `<p>${escapeHtml(a.prompt)} — ${s.correct ? "correcta" : "incorrecta"}</p>`;
      return `<p>${escapeHtml(a.prompt)} — completada</p>`;
    }).join("");
    return `<h4>Clase ${i + 1}: ${escapeHtml(c.title)}</h4>${lines}`;
  }).join("");
  return `<tr><td colspan="99"><div class="student-detail">${blocks || "<p>Sin actividades registradas.</p>"}</div></td></tr>`;
}

function renderTeacherAllowlist(){
  const teacherRows = TEACHER_EMAILS.map(e => `<div class="allow-row"><span>${escapeHtml(e)}</span><span class="form-note">Profesor</span></div>`).join("");
  const allowRows = STATE.allowlist.map(a => `
    <div class="allow-row">
      <span>${escapeHtml(a.email)}</span>
      <button class="link-btn" data-action="remove-allowed-email" data-email="${escapeHtml(a.email)}">Quitar</button>
    </div>`).join("") || `<p class="form-note">Todavía no autorizaste a ningún alumno.</p>`;

  return `
    <div style="margin-top:1.5rem; max-width:480px;">
      <h3 class="section-heading" style="margin-top:0;">Agregar alumno</h3>
      <form data-action="add-allowed-email">
        <label>Correo de Google del alumno</label>
        <input type="email" name="email" placeholder="alumno@gmail.com" required>
        <div class="form-actions"><button type="submit" class="btn small gold">Autorizar</button></div>
      </form>

      <h3 class="section-heading">Alumnos autorizados</h3>
      ${allowRows}

      <h3 class="section-heading">Profesores</h3>
      <p class="form-note">Se definen en el código (constante TEACHER_EMAILS), no acá.</p>
      ${teacherRows}
    </div>`;
}

/* ---------------- Helpers ---------------- */
function extractYoutubeId(url){
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}

/* ---------------- Event delegation ---------------- */
document.getElementById("app").addEventListener("click", async (e) => {
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;

  if(action === "google-login"){ signInWithGoogle(); }
  else if(action === "logout"){ logout(); }
  else if(action === "select-class"){ STATE.selectedClassId = el.dataset.id; render(); }
  else if(action === "delete-class"){ await deleteClass(el.dataset.id); }
  else if(action === "edit-class-toggle"){ STATE.editingClassId = el.dataset.id; render(); }
  else if(action === "cancel-edit-class"){ STATE.editingClassId = null; render(); }
  else if(action === "import-lessons"){ await importLessons(); }
  else if(action === "delete-activity"){ await deleteActivity(el.dataset.class, el.dataset.activity); }
  else if(action === "toggle-checklist"){ await toggleChecklist(el.dataset.class, el.dataset.activity); }
  else if(action === "answer-quiz"){ await answerQuiz(el.dataset.class, el.dataset.activity, parseInt(el.dataset.index, 10)); }
  else if(action === "remove-allowed-email"){ await removeAllowedEmail(el.dataset.email); }
  else if(action === "teacher-tab"){
    STATE.teacherTab = el.dataset.tab;
    if(STATE.teacherTab === "progreso"){ await loadStudentProfiles(); await loadAllProgress(); }
    else if(STATE.teacherTab === "alumnos"){ await loadAllowlist(); }
    render();
  }
  else if(action === "toggle-student"){
    const uid = el.dataset.uid;
    STATE.expandedStudent = STATE.expandedStudent === uid ? null : uid;
    render();
  }
});

document.getElementById("app").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const action = form.dataset.action;

  if(action === "add-class") await addClass(form);
  else if(action === "edit-class") await editClass(form.dataset.class, form);
  else if(action === "add-activity") await addActivity(form.dataset.class, form);
  else if(action === "reflection") await submitReflection(form.dataset.class, form.dataset.activity, form.answer.value);
  else if(action === "add-allowed-email") await addAllowedEmail(form);
});

render();
</script>
