function renderTeacherProgress(){
  if(!STATE.profiles.length) return `<p class="empty" style="margin-top:1.5rem;">Todavía no hay alumnos que hayan ingresado.</p>`;
  if(!STATE.classes.length) return `<p class="empty" style="margin-top:1.5rem;">Crea al menos una clase para ver el progreso.</p>`;

  const withOverall = STATE.profiles.map(p => {
    const prog = STATE.allProgress[p.uid] || {};
    return { profile: p, prog, overall: overallCompletion(prog) };
  });
  withOverall.sort((a, b) => (a.overall === null ? -1 : a.overall) - (b.overall === null ? -1 : b.overall));

  const rows = withOverall.map(({ profile: p, prog, overall }) => {
    const cells = STATE.classes.map(c => {
      const pct = classCompletion(prog, c);
      return `<td>${pct === null ? "—" : pct + "%"}</td>`;
    }).join("");
    return `
      <tr>
        <td><button class="student-name-btn" data-action="toggle-student" data-uid="${p.uid}">${escapeHtml(p.displayName || p.email)}</button></td>
        <td><strong>${overall === null ? "—" : overall + "%"}</strong></td>
        ${cells}
      </tr>
      ${STATE.expandedStudent === p.uid ? renderStudentDetail(p, prog) : ""}
    `;
  }).join("");

  const headerCells = STATE.classes.map((c, i) => `<th>Clase ${i + 1}</th>`).join("");

  return `
    <p class="form-note" style="margin-top:1.5rem;">Ordenado de menor a mayor avance total, para detectar rápido quién necesita un empujón.</p>
    <div style="overflow-x:auto;">
      <table class="progress-table">
        <thead><tr><th>Alumno</th><th>Avance total</th>${headerCells}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

      const s = prog[c.id] && prog[c.id][a.id];
      if(!s || !s.done) return `<p>${escapeHtml(a.prompt)} — sin completar</p>`;
      if(a.type === "reflection") return `<p>${escapeHtml(a.prompt)} — "${escapeHtml(s.answer)}"</p>`;
      if(a.type === "quiz") return `<p>${escapeHtml(a.prompt)} — ${s.correct ? "correcta" : "incorrecta"}</p>`;
      return `<p>${escapeHtml(a.prompt)} — completada</p>`;
    }).join("");
    return `<h4>Clase ${i + 1}: ${escapeHtml(c.title)}</h4>${lines}`;
  }).join("");
  return `<tr><td colspan="99"><div class="student-detail">${blocks || "<p>Sin actividades registradas.</p>"}</div></td></tr>`;
}

function renderTeacherAllowlist(){
  const teacherRows = TEACHER_EMAILS.map(e => `<div class="allow-row"><span>${escapeHtml(e)}</span><span class="form-note">${escapeHtml(roleLabel(e))}</span></div>`).join("");
  const allowRows = STATE.allowlist.map(a => `
    <div class="allow-row">
      <span>${escapeHtml(a.email)}</span>
      <button class="link-btn" data-action="remove-allowed-email" data-email="${escapeHtml(a.email)}">Quitar</button>
    </div>`).join("") || `<p class="form-note">Todavía no autorizaste a ningún alumno.</p>`;

  return `
    <div style="margin-top:1.5rem; max-width:480px;">
      <h3 class="section-heading" style="margin-top:0;">Agregar alumno</h3>
      <form data-action="add-allowed-email">
        <label>Correo de Google del alumno</label>
        <input type="email" name="email" placeholder="alumno@gmail.com" required>
        <div class="form-actions"><button type="submit" class="btn small gold">Autorizar</button></div>
      </form>

      <h3 class="section-heading">Alumnos autorizados</h3>
      ${allowRows}

      <h3 class="section-heading">Maestros y Maestras</h3>
      <p class="form-note">Se definen en el código (constante TEACHER_EMAILS), no acá.</p>
      ${teacherRows}
    </div>`;
}

/* ---------------- Helpers ---------------- */
function extractYoutubeId(url){
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}

/* ---------------- Event delegation ---------------- */
document.getElementById("app").addEventListener("click", async (e) => {
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;

  if(action === "google-login"){ signInWithGoogle(); }
  else if(action === "logout"){ logout(); }
  else if(action === "select-class"){ STATE.selectedClassId = el.dataset.id; render(); }
  else if(action === "delete-class"){ await deleteClass(el.dataset.id); }
  else if(action === "edit-class-toggle"){ STATE.editingClassId = el.dataset.id; render(); }
  else if(action === "cancel-edit-class"){ STATE.editingClassId = null; render(); }
  else if(action === "import-lessons"){ await importLessons(); }
  else if(action === "delete-activity"){ await deleteActivity(el.dataset.class, el.dataset.activity); }
  else if(action === "toggle-checklist"){ await toggleChecklist(el.dataset.class, el.dataset.activity); }
  else if(action === "answer-quiz"){ await answerQuiz(el.dataset.class, el.dataset.activity, parseInt(el.dataset.index, 10)); }
  else if(action === "remove-allowed-email"){ await removeAllowedEmail(el.dataset.email); }
  else if(action === "teacher-tab"){
    STATE.teacherTab = el.dataset.tab;
    if(STATE.teacherTab === "progreso"){ await loadStudentProfiles(); await loadAllProgress(); }
    else if(STATE.teacherTab === "alumnos"){ await loadAllowlist(); }
    render();
  }
  else if(action === "toggle-student"){
    const uid = el.dataset.uid;
    STATE.expandedStudent = STATE.expandedStudent === uid ? null : uid;
    render();
  }
});

document.getElementById("app").addEventListener("change", (e) => {
  if(e.target.dataset && e.target.dataset.action === "select-class-dropdown"){
    STATE.selectedClassId = e.target.value;
    render();
  }
});

document.getElementById("app").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const action = form.dataset.action;

  if(action === "add-class") await addClass(form);
  else if(action === "edit-class") await editClass(form.dataset.class, form);
  else if(action === "add-activity") await addActivity(form.dataset.class, form);
  else if(action === "reflection") await submitReflection(form.dataset.class, form.dataset.activity, form.answer.value);
  else if(action === "add-allowed-email") await addAllowedEmail(form);
});

render();
</script>
